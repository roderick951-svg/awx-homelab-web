---
- name: Ensure package cache is updated
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure Nginx is installed
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Ensure Nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: Deploy custom homelab landing page
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html>
      <head>
          <title>Welcome Mat</title>
          <style>
              body { font-family: sans-serif; text-align: center; margin-top: 10%; background: #f4f4f9; }
              h1 { color: #4F46E5; }
          </style>
      </head>
      <body>
          <h1>Welcome to the Homelab!</h1>
          <p>Hello, {{ homelab_user }}.</p>
          <p><strong>Status:</strong> {{ homelab_message }}</p>
      </body>
      </html>
    owner: www-data
    group: www-data
    mode: '0644'
